name: iOS Simulator

# 在云端 macOS 上跑 iPhone 16 Pro 模拟器：
# 选设备 → 按该设备编译 → 装进模拟器 → 启动 → 截图 → 存 artifact。
# 失败时把错误写回 ci-error.txt（这样日志在仓库里也能看到）。
# 公开仓库的 macOS runner 免费、无分钟上限。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator:
    name: Build & screenshot
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: |
          xcodebuild -version
          echo "--- runtimes ---"
          xcrun simctl list runtimes

      - name: 安装 xcodegen
        run: |
          brew install xcodegen || true
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          cd app
          xcodegen generate
          ls -d *.xcodeproj

      - name: 选一台 iPhone 模拟器
        id: sim
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone 16 Pro$"))] | first | .udid // empty')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j \
              | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | .[-1] | .udid // empty')
          fi
          if [ -z "$UDID" ]; then
            echo "::error::没有可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          NAME=$(xcrun simctl list devices available -j | jq -r --arg u "$UDID" '[.devices[][] | select(.udid == $u)] | first | .name')
          echo "选中: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: 编译（模拟器，不签名）
        run: |
          cd app
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj \
            -scheme DshIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../xcodebuild-sim.log | tail -50

      - name: 启动模拟器
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: 装进模拟器
        run: |
          APP=$(find app/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: 启动并截图
        run: |
          set +e
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.wsw.dsh-remote

          ( xcrun simctl spawn "$UDID" log stream --style compact \
              --predicate "process == \"DshIOS\"" > app-log.txt 2>&1 & echo $! > log.pid )

          xcrun simctl launch "$UDID" "$BUNDLE" || echo "launch 返回非零"

          sleep 6
          xcrun simctl io "$UDID" screenshot shot-01-launch.png
          sleep 6
          xcrun simctl io "$UDID" screenshot shot-02.png
          sleep 8
          xcrun simctl io "$UDID" screenshot shot-03.png

          kill "$(cat log.pid)" 2>/dev/null
          ls -lh *.png 2>/dev/null
          echo "--- App 日志（尾部）---"
          tail -40 app-log.txt

      - name: 崩溃时补充诊断
        if: always()
        run: |
          echo "=== 最近崩溃报告 ==="
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -8
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/DshIOS*.ips 2>/dev/null | head -2); do
            echo "--- $f ---"; head -60 "$f"
          done

      - name: 把编译错误挂成注解（公开可读，助手能直接取到）
        if: failure()
        run: |
          {
            grep "error:" xcodebuild-sim.log 2>/dev/null | head -10
            echo ""
            echo "--- log tail ---"
            tail -25 xcodebuild-sim.log 2>/dev/null
          } > ci-error.txt || true
          echo "=== 失败摘要 ==="
          cat ci-error.txt || true

          # 每条 error 变成一条注解（最多 10 条）
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            n=$((n+1))
            [ $n -gt 10 ] && break
            echo "::error title=err$n::$line"
          done < <(grep "error:" xcodebuild-sim.log 2>/dev/null | head -10)

          if [ $n -eq 0 ]; then
            echo "::error title=no-error-lines::没找到 error: 行，见 artifact 里的 xcodebuild-sim.log"
          fi

      - name: 上传截图和日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            shot-*.png
            app-log.txt
            xcodebuild-sim.log
            ci-error.txt
          if-no-files-found: warn
